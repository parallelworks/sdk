name: '📦 Build and Publish SDKs'

on:
  push:
    branches:
      - canary
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v6.9.0). Leave empty to skip publishing.'
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: '📦 Build and Publish'
    runs-on: ubuntu-latest
    steps:
      - name: '🔍 Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: '🔢 Detect version'
        id: version
        run: |
          # Check for manual input first
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Publishing version: $VERSION (manual trigger)"
            exit 0
          fi

          # Check if this push was from the core repo sync (commit message contains version)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" =~ sync\ SDK\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Publishing version: $VERSION (synced from core)"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "No version detected, skipping publish"
          fi

      # ============ SETUP TOOLS ============
      - name: '⚙️ Setup Node.js'
        if: steps.version.outputs.is_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: '⚙️ Setup pnpm'
        if: steps.version.outputs.is_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: '⚙️ Setup uv'
        if: steps.version.outputs.is_release == 'true'
        uses: astral-sh/setup-uv@v5

      # ============ PUBLISH TYPESCRIPT ============
      - name: '📥 Install TypeScript dependencies'
        if: steps.version.outputs.is_release == 'true'
        run: |
          cd typescript
          pnpm install

      - name: '🔧 Generate TypeScript types'
        if: steps.version.outputs.is_release == 'true'
        run: |
          cd typescript
          pnpm run generate

      - name: '🚀 Build and publish TypeScript to npm'
        if: steps.version.outputs.is_release == 'true'
        run: |
          cd typescript
          pnpm run build
          mkdir -p dist/types
          cp src/types/api.d.ts dist/types/
          pnpm publish --no-git-checks --provenance

      # ============ PUBLISH PYTHON ============
      - name: '🔧 Generate Python client'
        if: steps.version.outputs.is_release == 'true'
        run: |
          cd python
          cp parallelworks_client/__init__.py /tmp/pw-init-backup.py
          cp parallelworks_client/auth.py /tmp/pw-auth-backup.py
          uvx openapi-python-client generate \
            --path ../openapi.json \
            --output-path ./parallelworks_client \
            --meta none \
            --overwrite
          mv /tmp/pw-init-backup.py parallelworks_client/__init__.py
          mv /tmp/pw-auth-backup.py parallelworks_client/auth.py

      - name: '🚀 Build and publish Python to PyPI'
        if: steps.version.outputs.is_release == 'true'
        run: |
          cd python
          uv build
          uv publish --trusted-publishing always

      # ============ GO TAG ============
      # Go module tag is created by the core repo sync step.
      # This is a no-op unless manually triggered.
      - name: '🚀 Create Go module tag (manual only)'
        if: steps.version.outputs.is_release == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          TAG="go/v${{ steps.version.outputs.version }}"

          # Only create tag if it doesn't exist
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag: $TAG"
          fi
